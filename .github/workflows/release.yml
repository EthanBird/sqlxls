name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: sqlxls-x86_64-unknown-linux-gnu
            bin: sqlxls
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: sqlxls-x86_64-pc-windows-msvc.exe
            bin: sqlxls.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: sqlxls-aarch64-apple-darwin
            bin: sqlxls
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: sqlxls-x86_64-apple-darwin
            bin: sqlxls
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p dist
          src="target/${{ matrix.target }}/release/${{ matrix.bin }}"
          dst="dist/${{ matrix.artifact }}"
          cp "$src" "$dst"
          if [[ "${{ matrix.os }}" != "windows-latest" ]]; then
            chmod +x "$dst"
          fi
          ls -lh "$dst"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: List artifacts
        run: ls -lh dist
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
          body: |
            sqlxls ${{ github.ref_name }}

            用 SQL 查询、清理 Excel / CSV / JSON / HTTP 数据。

            ### 下载

            按系统选择对应文件，放进 `PATH` 后执行 `sqlxls --help`。

            | 平台 | 文件 |
            |------|------|
            | Linux x86_64 | `sqlxls-x86_64-unknown-linux-gnu` |
            | macOS Apple Silicon | `sqlxls-aarch64-apple-darwin` |
            | macOS Intel | `sqlxls-x86_64-apple-darwin` |
            | Windows x86_64 | `sqlxls-x86_64-pc-windows-msvc.exe` |

            用法见 README：`sqlxls "LOAD t FROM 'data.xlsx'; SELECT * FROM t"`。
