[package]
name = "sqlxls"
version = "0.3.0"
edition = "2021"
rust-version = "1.88"
description = "用 SQL 清理和分析 Excel / CSV / JSON / HTTP 等表格数据"
license = "MIT"
repository = "https://github.com/EthanBird/sqlxls"
homepage = "https://github.com/EthanBird/sqlxls"
readme = "README.md"
keywords = ["sql", "excel", "csv", "cli"]
categories = ["command-line-utilities"]

[profile.release]
lto = true
codegen-units = 1
strip = true

[dependencies]
clap = { version = "4.5", features = ["derive"] }
calamine = { version = "0.26", features = ["dates"] }
rust_xlsxwriter = "0.78"
rusqlite = { version = "0.31", features = ["bundled", "functions"] }
anyhow = "1.0"
comfy-table = "7.1"
csv = "1.3"
serde_json = "1.0"
glob = "0.3"
clipboard-rs = "0.2"
fake = "2.9"
reqwest = { version = "0.11", default-features = false, features = ["blocking", "rustls-tls", "json"] }
chrono = { version = "0.4", default-features = false, features = ["alloc", "std"] }
encoding_rs = "0.8"
sqlparser = { version = "0.53", features = ["visitor"] }